<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Thesis</title>
<style>
/* Layout: slim bar on top, the book centred on a quiet "reading desk"; contents slide in from the left.
   On phones the bar and toolbar float over a full-screen book and can be tapped away.
   Colour: neutral greys; the cover's teal for navigation, its peach for the two document actions. */
:root {
  --desk: #dfe3e5; --desk-shade: #cfd5d8; --bar: #f6f7f7; --panel: #ffffff;
  --ink: #1d2a31; --muted: #5a6970; --line: #c9d0d3;
  --teal: #3b7590; --teal-2: #5e98a3; --teal-ink: #ffffff; --teal-soft: #e3eff2;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #d98f52;
  --overlay: rgba(20, 30, 36, .86);
  --f-title: Georgia, "Times New Roman", serif;
  --f-ui: Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #161b1e; --desk-shade: #0f1315; --bar: #1f262a; --panel: #1a2024; --ink: #e4e9eb; --muted: #9aa8ae;
  --line: #34404a; --teal: #4f8ea6; --teal-2: #6aa6b0; --teal-ink: #ffffff; --teal-soft: #1e3640;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #f2af78; --overlay: rgba(5, 8, 10, .9); color-scheme: dark } }
:root[data-theme="dark"] {
  --desk: #161b1e; --desk-shade: #0f1315; --bar: #1f262a; --panel: #1a2024; --ink: #e4e9eb; --muted: #9aa8ae;
  --line: #34404a; --teal: #4f8ea6; --teal-2: #6aa6b0; --teal-ink: #ffffff; --teal-soft: #1e3640;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #f2af78; --overlay: rgba(5, 8, 10, .9); color-scheme: dark }

html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 40%, var(--desk) 0%, var(--desk-shade) 100%) fixed, var(--desk);
  color: var(--ink); font-family: var(--f-ui); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top */
.top { flex: none; z-index: 15; transition: transform .25s ease; }
.bar { display: flex; align-items: center; gap: 10px 16px; min-height: 56px; background: var(--bar); border-bottom: 1px solid var(--line); padding-block: 8px; }
.bar h1 { font-family: var(--f-title); font-weight: 600; font-size: 19px; margin: 0; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-wrap { display: flex; align-items: center; gap: 12px; }
.dl-wrap p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.35; max-width: 34ch; }
.btn {
  font: 14px/1 var(--f-ui); border-radius: 6px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); text-decoration: none; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 8px; min-height: 38px;
}
.btn:hover { border-color: var(--teal); }
.btn.ghost { border-color: transparent; }
.btn:focus-visible, .toc a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn small { opacity: .75; font-size: 12px; }
.btn svg { width: 17px; height: 17px; flex: none; }
/* Contents: the cover's teal gradient, so navigation is the first thing you notice */
.btn.contents { background: linear-gradient(135deg, var(--teal), var(--teal-2)); color: var(--teal-ink); border-color: transparent; font-size: 15px; padding: 9px 16px 9px 13px; }
.btn.contents:hover { filter: brightness(1.07); }
/* Peach: the two things you do with the document (download, flip a figure) */
.btn.peach { background: var(--peach); color: var(--peach-ink); border-color: var(--peach-line); }
.btn.peach:hover { filter: brightness(1.04); border-color: var(--peach-ink); }

/* stage + book */
.stage { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-block: 16px; }
.bookwrap { position: relative; }
#book { position: relative; filter: drop-shadow(0 12px 24px rgba(0,0,0,.22)); }
.page { background: #fff; overflow: hidden; }
.page canvas { display: block; width: 100%; height: 100%; }
.page .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa4ab; font: 12px var(--f-ui); }
#book .page::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; z-index: 2; }
#book .page.l::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }
#book .page.r::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.12), transparent); }
.tapzones { position: absolute; inset: 0; display: grid; grid-template-columns: 30% 40% 30%; z-index: 5; }
.tapzones button { background: transparent; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* toolbar under the book */
.tools { flex: none; display: flex; gap: 8px 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding-block: 0 16px; font-variant-numeric: tabular-nums; color: var(--muted); z-index: 15; transition: transform .25s ease; }
.tools .count { min-width: 12ch; text-align: center; line-height: 1.3; }
.tools .count b { display: block; color: var(--ink); font-weight: 500; font-size: 12px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* contents drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); z-index: 31; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; transform: translateX(-102%); transition: transform .25s ease; visibility: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
}
.drawer.open { transform: none; visibility: visible; }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 20px; }
.drawer h2 { font-family: var(--f-title); font-size: 20px; font-weight: 600; margin: 0; }
.toc { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1 1 auto; }
.toc a { display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.35; }
.toc a span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.toc a:hover, .toc a[aria-current="true"] { background: var(--teal-soft); }
.toc a[aria-current="true"] { color: var(--teal); font-weight: 600; }
.toc a { font-size: 15px; }
.icon-btn { width: 36px; height: 36px; padding: 0; justify-content: center; }

/* phones: floating chrome over a full-screen book */
body.immersive .top { position: fixed; top: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top, 0px); }
body.immersive .stage { padding-block: 8px; }
body.immersive .tools { position: fixed; left: 0; right: 0; bottom: 0; padding-block: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); background: var(--bar); border-top: 1px solid var(--line); }
body.chrome-off .top { transform: translateY(-110%); }
body.chrome-off .tools { transform: translateY(110%); }
.pill { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 16; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 80px); z-index: 16; width: min(340px, calc(100% - 32px)); background: var(--ink); color: var(--bar); border-radius: 10px; padding: 12px 12px 12px 16px; display: flex; gap: 12px; align-items: center; font-size: 13px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.hint svg { width: 28px; height: 28px; flex: none; }
.hint button { margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 6px; padding: 6px 10px; font: 500 12px var(--f-ui); }

/* flip figure */
.lightbox { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox canvas { background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.4); max-width: 100%; }
.lightbox .row { display: flex; gap: 10px; }
.lightbox .btn { color: #fff; border-color: rgba(255,255,255,.4); }

.toast { position: fixed; left: 50%; bottom: max(80px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bar); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.err { max-width: 50ch; text-align: center; color: var(--muted); }

@media (max-width: 860px) { .dl-wrap p { display: none; } }
@media (max-width: 560px) {
  .bar { gap: 8px; }
  .bar h1 { font-size: 16px; }
  .dl small, .dl .long { display: none; }
  .btn.contents { padding: 9px 12px 9px 10px; }
}
@media (min-width: 561px) { .dl .short { display: none; } }
@media (prefers-reduced-motion: reduce) { .top, .tools, .drawer { transition: none; } }
</style>
</head>
<body>
<div class="top" id="top">
  <header class="bar gutter">
    <button class="btn contents" id="tocBtn" aria-controls="drawer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Contents</button>
    <h1 id="title"></h1>
    <button class="btn" id="resume" hidden>Continue at p. <span id="resumePage"></span></button>
    <div class="dl-wrap">
      <p>Prefer your own PDF reader? Download the full thesis to search, rotate pages and annotate.</p>
      <a class="btn peach dl" href="thesis.pdf" download>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>
        <span class="long">Download PDF</span><span class="short">PDF</span> <small class="size"></small></a>
    </div>
  </header>
</div>

<main class="stage gutter" id="stage"><p class="err">Loading the book…</p></main>
<footer class="tools gutter" id="tools">
  <button class="btn" id="prev" aria-label="Previous page">‹</button>
  <span class="count" id="count"></span>
  <button class="btn" id="next" aria-label="Next page">›</button>
  <span id="flipSlot" style="display:contents"></span>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Contents">
  <header><h2>Contents</h2><button class="btn ghost icon-btn" id="tocClose" aria-label="Close contents">✕</button></header>
  <ol class="toc" id="toc"></ol>
</aside>

<div class="pill" id="pill" hidden></div>
<div class="hint" id="hint" hidden>
  <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="10" height="17" rx="2"/><path d="M5 23a10 10 0 0 0 18 0M20 21l3 2 1-3"/></svg>
  <span>Turn your phone sideways to see two pages side by side.</span>
  <button id="hintClose">OK</button>
</div>
<div class="lightbox" id="lb" hidden>
  <canvas id="lbCanvas"></canvas>
  <div class="row">
    <button class="btn" id="lbRotate">Rotate again</button>
    <button class="btn" id="lbClose">Close</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
// DEMO is true only in the Claude preview, where downloads are blocked.
const DEMO = /*DEMO*/false;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage');
const POS_KEY = 'thesis-page', HINT_KEY = 'thesis-hint';
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const ICON_ROT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-2-4"/><path d="M11 1v3h3"/></svg>';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let doc, numPages = 0, aspect = 0.709, config = { title: '', chapters: [], flip: [] };
let flip = null, cleanup = [], currentPage = 1;

// ---------- helpers (storage is optional: the site works without it) ----------
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
// Set only when the admin tool shows this page as its preview (never on the public site).
const DRAFT = window.__DRAFT || null;
function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, ms); }
const fmtSize = b => b >= 1048576 ? `${Math.round(b / 1048576)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fileName = t => (t || 'thesis').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 80) + '.pdf';

// ---------- PDF ----------
const pageCache = new Map();
function getPage(n) { if (!pageCache.has(n)) pageCache.set(n, doc.getPage(n)); return pageCache.get(n); }
// Draws page n into a canvas fitting w×h CSS px. In the book a landscape page is turned to fill its
// portrait slot, as in print. extraRot adds a manual turn (90 = a quarter turn to the right).
async function renderInto(canvas, n, w, h, { extraRot = 0, fitRotate = true } = {}) {
  const page = await getPage(n);
  const base = page.getViewport({ scale: 1 });
  let rot = page.rotate;
  if (fitRotate && base.width > base.height && h > w) rot += 90;
  rot = (rot + extraRot) % 360;
  const v1 = page.getViewport({ scale: 1, rotation: rot });
  const scale = Math.min(w / v1.width, h / v1.height);
  const vp = page.getViewport({ scale: scale * dpr, rotation: rot });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
  canvas.style.width = Math.floor(vp.width / dpr) + 'px'; canvas.style.height = Math.floor(vp.height / dpr) + 'px';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
}
// Fallback when config.json is missing: chapters from the PDF's own bookmarks.
async function readOutline(d) {
  const out = [];
  for (const it of (await d.getOutline()) || []) {
    try {
      const dest = typeof it.dest === 'string' ? await d.getDestination(it.dest) : it.dest;
      if (!dest) continue;
      const idx = typeof dest[0] === 'number' ? dest[0] : await d.getPageIndex(dest[0]);
      out.push({ title: it.title.trim(), page: idx + 1 });
    } catch {}
  }
  return out.sort((a, b) => a.page - b.page);
}

// ---------- load: thesis.pdf + config.json next to this page, or the admin's draft ----------
async function loadBook() {
  const draft = DRAFT;
  let url = 'thesis.pdf', size = 0;
  if (draft && draft.blob) {
    doc = await pdfjsLib.getDocument({ data: new Uint8Array(await draft.blob.arrayBuffer()) }).promise;
    url = URL.createObjectURL(draft.blob); size = draft.blob.size;
  } else {
    // disableAutoFetch + range requests: only the pages being looked at are downloaded,
    // so a 40 MB thesis opens as fast as a small one.
    doc = await pdfjsLib.getDocument({ url: 'thesis.pdf', disableAutoFetch: true, disableStream: true, rangeChunkSize: 262144 }).promise;
    try { size = (await doc.getDownloadInfo()).length; } catch {}
  }
  if (draft) config = draft.config;
  else {
    try { const r = await fetch('config.json', { cache: 'no-cache' }); if (!r.ok) throw 0; config = await r.json(); }
    catch { config = { title: 'Thesis', chapters: await readOutline(doc), flip: [] }; }
  }
  config.flip = config.flip || []; config.chapters = config.chapters || [];
  numPages = doc.numPages;
  aspect = (await getPage(1)).getViewport({ scale: 1 }).width / (await getPage(1)).getViewport({ scale: 1 }).height;
  $('#title').textContent = config.title || 'Thesis';
  document.title = config.title || 'Thesis';
  $$('.dl').forEach(a => { a.href = url; a.download = fileName(config.title); a.querySelector('.size').textContent = size ? fmtSize(size) : ''; });
  renderToc();
}

// ---------- reading position ----------
const savedPos = () => parseInt(ls.get(POS_KEY), 10) || 0;
function setCurrent(p) { currentPage = p; if (p > 1) ls.set(POS_KEY, String(p)); updateTocCurrent(); }
function showResume() { const p = savedPos(); $('#resume').hidden = !(p > 1) || p > numPages; $('#resumePage').textContent = p; }
$('#resume').onclick = () => { goTo(savedPos()); $('#resume').hidden = true; };

// ---------- contents ----------
function chapterAt(p) { let c = null; for (const ch of config.chapters) if (ch.page <= p) c = ch; return c; }
function renderToc() {
  $('#toc').innerHTML = config.chapters.length
    ? config.chapters.map(ch => `<li><a href="#" data-page="${ch.page}"><span>${esc(ch.title)}</span><span>${ch.page}</span></a></li>`).join('')
    : '<li class="err" style="padding:12px">No chapters available.</li>';
  updateTocCurrent();
}
function updateTocCurrent() { const c = chapterAt(currentPage); $$('#toc a').forEach(a => a.setAttribute('aria-current', !!c && +a.dataset.page === c.page)); }
function openDrawer(o) { $('#drawer').classList.toggle('open', o); $('#scrim').hidden = !o; if (o) setTimeout(() => $('#tocClose').focus(), 50); }
$('#tocBtn').onclick = () => openDrawer(true);
$('#tocClose').onclick = () => openDrawer(false);
$('#scrim').onclick = () => openDrawer(false);
$('#toc').onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); goTo(+a.dataset.page); openDrawer(false); };
function goTo(p) { if (flip) { flip.turnToPage(p - 1); onFlip(flip.getCurrentPageIndex()); } }

// ---------- phones ----------
// The admin preview can force phone mode, since a desktop mouse never counts as a touch screen.
const isPhone = () => !!(DRAFT && DRAFT.phone) || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 600);
const isPortrait = () => innerHeight > innerWidth;
function setChrome(on) { document.body.classList.toggle('chrome-off', !on); updatePill(); }
function updateHint() { $('#hint').hidden = !(isPhone() && isPortrait() && ls.get(HINT_KEY) !== 'done'); }
$('#hintClose').onclick = () => { ls.set(HINT_KEY, 'done'); updateHint(); };

// ---------- pages ----------
function makePage(n, w, h) {
  const el = document.createElement('div');
  el.className = 'page' + (n > 1 && n < numPages ? (n % 2 === 0 ? ' l' : ' r') : '');
  if (n === 1 || n === numPages) el.dataset.density = 'hard';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.innerHTML = `<div class="ph">p. ${n}</div>`;
  el.dataset.n = n;
  return el;
}
function ensureRendered(el, w, h) {
  if (el.dataset.done) return;
  el.dataset.done = '1';
  const c = document.createElement('canvas');
  renderInto(c, +el.dataset.n, w, h).then(() => { el.querySelector('.ph')?.remove(); el.prepend(c); c.style.width = '100%'; c.style.height = '100%'; });
}
function flipButtons(pages, cls) {
  const marked = pages.filter(p => config.flip.includes(p));
  return marked.map(p => `<button class="${cls}" data-flip="${p}">${ICON_ROT} Flip figure${pages.length > 1 ? ` p. ${p}` : ''}</button>`).join('');
}
let visiblePages = [1];
function updatePill() {
  const html = document.body.classList.contains('chrome-off') ? flipButtons(visiblePages, 'btn peach') : '';
  $('#pill').innerHTML = html; $('#pill').hidden = !html;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-flip]'); if (b) { e.stopPropagation(); openFlip(+b.dataset.flip); } }, true);

// ---------- the flipbook ----------
function sizeFor(single) {
  const r = stage.getBoundingClientRect();
  const pad = isPhone() ? 16 : 32;
  const per = single ? r.width - pad : (r.width - pad) / 2;
  const w = Math.max(140, Math.floor(Math.min(per, (r.height - pad) * aspect)));
  return { w, h: Math.floor(w / aspect) };
}
function onFlip(i) {
  let vis;
  if (flip._single || i === 0) vis = [i];
  else { const left = i % 2 === 1 ? i : i - 1; vis = [left, left + 1].filter(k => k < numPages); }   // spreads are (2,3), (4,5)…
  for (let k = i - 2; k <= i + 5; k++) if (flip._pages[k]) ensureRendered(flip._pages[k], flip._w, flip._h);
  visiblePages = vis.map(k => k + 1);
  const last = visiblePages[visiblePages.length - 1];
  const ch = chapterAt(last);
  $('#count').innerHTML = `${ch ? `<b>${esc(ch.title)}</b>` : ''}${i === 0 ? 'Cover' : visiblePages.length > 1 ? `p. ${visiblePages[0]}–${visiblePages[1]} of ${numPages}` : `p. ${last} of ${numPages}`}`;
  $('#flipSlot').innerHTML = flipButtons(visiblePages, 'btn peach');
  setCurrent(last);
  updatePill();
}
function build(start) {
  cleanup.forEach(f => f()); cleanup = [];
  if (flip) { try { flip.destroy(); } catch {} flip = null; }
  const phone = isPhone();
  document.body.classList.toggle('immersive', phone);
  setChrome(true);
  const single = phone ? isPortrait() : stage.getBoundingClientRect().width < 640;
  const { w, h } = sizeFor(single);
  stage.innerHTML = `<div class="bookwrap"><div id="book"></div>${phone ? '<div class="tapzones"><button data-t="prev" aria-label="Previous page"></button><button data-t="menu" aria-label="Show or hide controls"></button><button data-t="next" aria-label="Next page"></button></div>' : ''}</div>`;
  const pages = [];
  for (let n = 1; n <= numPages; n++) pages.push(makePage(n, w, h));
  flip = new St.PageFlip($('#book'), {
    width: w, height: h, size: 'fixed', showCover: true, usePortrait: single,
    maxShadowOpacity: .45, mobileScrollSupport: false, flippingTime: 650, useMouseEvents: !phone
  });
  flip.loadFromHTML(pages);
  Object.assign(flip, { _pages: pages, _w: w, _h: h, _single: single });
  flip.on('flip', e => onFlip(e.data));
  if (start > 1) flip.turnToPage(start - 1);
  onFlip(flip.getCurrentPageIndex());
  $('#prev').onclick = () => flip.flipPrev();
  $('#next').onclick = () => flip.flipNext();
  const tz = stage.querySelector('.tapzones');
  if (tz) tz.onclick = e => {
    const t = e.target.dataset.t;
    if (t === 'prev') { flip.flipPrev(); setChrome(false); }
    else if (t === 'next') { flip.flipNext(); setChrome(false); }
    else setChrome(document.body.classList.contains('chrome-off'));
  };
  const key = e => { if (!$('#lb').hidden || $('#drawer').classList.contains('open')) return; if (e.key === 'ArrowRight') flip.flipNext(); if (e.key === 'ArrowLeft') flip.flipPrev(); };
  document.addEventListener('keydown', key);
  cleanup.push(() => document.removeEventListener('keydown', key));
  updateHint();
  // Phones: show the controls briefly so people know they exist, then give the page the full screen.
  clearTimeout(build._t);
  if (phone) build._t = setTimeout(() => { if (!$('#drawer').classList.contains('open')) setChrome(false); }, 2500);
}

// ---------- flip figure: the page large, a quarter turn to the right ----------
let lb = { n: 1, rot: 0 };
async function drawLightbox() {
  const v = (await getPage(lb.n)).getViewport({ scale: 1 });
  const extra = (v.width > v.height ? 0 : 90) + lb.rot;   // a landscape page is already upright on its own
  await renderInto($('#lbCanvas'), lb.n, innerWidth - 40, innerHeight - 110, { extraRot: extra, fitRotate: false });
}
function openFlip(n) { lb = { n, rot: 0 }; $('#lb').hidden = false; drawLightbox(); }
$('#lbRotate').onclick = () => { lb.rot = (lb.rot + 90) % 360; drawLightbox(); };
$('#lbClose').onclick = () => { $('#lb').hidden = true; };
$('#lb').onclick = e => { if (e.target.id === 'lb') $('#lb').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#lb').hidden = true; openDrawer(false); } });

if (DEMO) {
  $$('.dl').forEach(a => a.addEventListener('click', () => toast('Downloads are blocked in this preview. On the real site this saves the PDF.')));}

// ---------- start: always on the closed cover ----------
let rt, lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 120) return;   // ignore mobile address-bar jitter
    lastW = innerWidth; lastH = innerHeight; build(currentPage);
  }, 250);
});
(async () => {
  try { await loadBook(); build(1); showResume(); }
  catch (e) { stage.innerHTML = `<p class="err">The book could not be loaded (${esc(e.message || e)}). You can still download the PDF from the top bar.</p>`; }
})();
</script>
