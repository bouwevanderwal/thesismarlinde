<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Expanding the precision medicine landscape of paediatric solid tumours with ex vivo drug screening</title>
<style>
/* Layout: a sidebar on the left (title, where you are, contents, download) and the book filling the
   rest at full height. Narrow screens and phones: the sidebar slides in from the Contents button in the bar.
   Colour: neutral greys; the cover's teal for navigation, its peach for the two document actions. */
:root {
  --desk: #dfe3e5; --desk-shade: #cfd5d8; --bar: #f6f7f7; --panel: #ffffff;
  --ink: #1d2a31; --muted: #5a6970; --line: #d3d9dc;
  --teal: #3b7590; --teal-2: #5e98a3; --teal-ink: #ffffff; --teal-soft: #e3eff2;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #d98f52;
  --reader-bg: #1c262b;
  --f-title: Georgia, "Times New Roman", serif;
  --f-ui: Georgia, "Times New Roman", serif;
  --side-w: 280px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #161b1e; --desk-shade: #0f1315; --bar: #1f262a; --panel: #1a2024; --ink: #e4e9eb; --muted: #9aa8ae;
  --line: #2f3a42; --teal: #4f8ea6; --teal-2: #6aa6b0; --teal-ink: #ffffff; --teal-soft: #1e3640;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #f2af78; color-scheme: dark } }
:root[data-theme="dark"] {
  --desk: #161b1e; --desk-shade: #0f1315; --bar: #1f262a; --panel: #1a2024; --ink: #e4e9eb; --muted: #9aa8ae;
  --line: #2f3a42; --teal: #4f8ea6; --teal-2: #6aa6b0; --teal-ink: #ffffff; --teal-soft: #1e3640;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #f2af78; color-scheme: dark }

html, body { height: 100%; }
/* iPhone Safari counts 100% as if its address bar weren't there, so the bottom of the site (with the
   bar) slid underneath it. dvh is the height that is actually visible, and follows the address bar. */
@supports (height: 100dvh) { html, body { height: 100dvh; } }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* iPhone: don't enlarge text in landscape */
body {
  background: radial-gradient(ellipse at 50% 40%, var(--desk) 0%, var(--desk-shade) 100%) fixed, var(--desk);
  color: var(--ink); font-family: var(--f-ui); font-size: 14px;
  display: flex; overflow: hidden;
}
.btn {
  font: 14px/1 var(--f-ui); border-radius: 6px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); text-decoration: none; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px;
  box-sizing: border-box;   /* min-height is the whole button, padding included */
}
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .35; cursor: default; border-color: var(--line); }
.btn.ghost { border-color: transparent; }
.btn:focus-visible, .toc a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn small { opacity: .75; font-size: 12px; }
.btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn { width: 38px; padding: 0; }
.btn.teal { background: linear-gradient(135deg, var(--teal), var(--teal-2)); color: var(--teal-ink); border-color: transparent; }
.btn.teal:hover { filter: brightness(1.07); }
.btn.peach { background: var(--peach); color: var(--peach-ink); border-color: var(--peach-line); }
.btn.peach:hover { filter: brightness(1.04); border-color: var(--peach-ink); }

/* ---------- sidebar ---------- */
.side {
  flex: none; width: var(--side-w); height: 100%; box-sizing: border-box; min-width: 0;
  display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
}
.side-head { display: flex; gap: 6px; align-items: flex-start; padding: 20px 10px 14px 20px; }
.side-head h1 {
  font: 700 17px/1.32 var(--f-title); margin: 0; flex: 1 1 auto; min-width: 0; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
}
.actions { display: grid; gap: 8px; padding: 0 16px 14px 20px; }
.actions:empty { display: none; }
.label { margin: 0; padding: 14px 20px 6px; font-size: 11px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); }
.toc { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.toc a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.35; font-size: 14px; }
.toc a small { grid-column: 1 / -1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc a .pg { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; align-self: start; }
.toc a:hover { background: var(--teal-soft); }
.toc a[aria-current="true"] { background: var(--teal-soft); color: var(--teal); font-weight: 700; }
.toc a[aria-current="true"] small, .toc a[aria-current="true"] .pg { color: var(--teal); }
.side-foot { flex: none; border-top: 1px solid var(--line); padding: 14px 16px 16px 20px; display: grid; gap: 10px; }

/* sidebar as a slide-in panel (narrow screens, phones, or hidden by the reader) */
body:not(.docked) .side {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 88vw); z-index: 31;
  transform: translateX(-102%); visibility: hidden; transition: transform .25s ease, visibility .25s;
  box-shadow: 8px 0 30px rgba(0,0,0,.18);
}
body:not(.docked) .side.open { transform: none; visibility: visible; }
body:not(.docked) .side { overscroll-behavior: contain; }
/* Low screens (a phone held sideways): the whole panel scrolls as one, with a compact title,
   and the download button stays pinned at the bottom. */
@media (max-height: 560px) {
  body:not(.docked) .side { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body:not(.docked) .side .toc { flex: none; overflow: visible; }
  body:not(.docked) .side-head { padding: 12px 8px 8px 20px; }
  body:not(.docked) .side-head h1 { font-size: 15px; -webkit-line-clamp: 2; }
  body:not(.docked) .label { padding-top: 10px; }
  body:not(.docked) .toc a { padding: 7px 12px; }
  body:not(.docked) .side-foot { position: sticky; bottom: 0; background: var(--panel); padding-block: 10px; }
  body:not(.docked) .side-foot .btn { min-height: 36px; }
}
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }

/* ---------- stage + book ---------- */
/* The outer area holds the floating bar; the inner stage holds the book and scrolls when zoomed in. */
.stage-outer { flex: 1 1 auto; min-width: 0; height: 100%; position: relative; }
.stage { position: absolute; inset: 0; z-index: 0; /* own layer: the flipbook's page layers stay below the bar */ box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px 16px; }
body.phone .stage { padding: 8px; }
/* Zoomed in: the book can be larger than the screen. Scroll (wheel, trackpad, scrollbars) or drag it. */
.stage.zoomed { display: block; overflow: auto; padding-bottom: 80px; cursor: grab; }
.stage.zoomed.dragging { cursor: grabbing; user-select: none; }
.stage.zoomed .bookwrap { margin: 0 auto; width: max-content; }
.bookwrap { position: relative; }
#book { position: relative; }   /* no CSS filter here: it makes the browser re-rasterise the pages and soften text */
#book .page { box-shadow: 0 8px 22px rgba(0,0,0,.16); }
.page { background: #fff; overflow: hidden; }
.page canvas { display: block; width: 100%; height: 100%; }
.page .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa4ab; font: 12px var(--f-ui); }
#book .page::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; z-index: 2; }
#book .page.l::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }
#book .page.r::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.12), transparent); }
/* Phones: the viewer handles all touches on the book itself (tap to turn, swipe, pinch to zoom the
   book only), so the browser must not zoom or scroll the whole page there. */
/* Phones: Safari must never zoom the whole web page (also not when a pinch starts on the bar or the
   empty space); only the Contents panel may scroll, vertically. */
html.phone, body.phone, body.phone .booknav { touch-action: none; }
body.phone .side, body.phone .toc { touch-action: pan-y; }
body.phone .stage { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

/* Page number, page turning and Flip figure: one floating bar over the bottom of the book */
.booknav {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 10px)); z-index: 16;
  display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 6px 20px rgba(0,0,0,.18); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.booknav .btn { min-height: 34px; border-radius: 999px; }
.booknav .icon-btn { width: 34px; font-size: 18px; }
.booknav .count { padding: 0 8px; font-size: 13px; color: var(--muted); }
.booknav .flipslot { display: flex; gap: 4px; }
.booknav .flipslot:empty { display: none; }
.booknav .flipslot .btn { padding: 7px 13px; font-size: 13px; }
.booknav #fsBtn svg { width: 16px; height: 16px; }
body.phone #fsBtn { display: none !important; }       /* iPhones don't allow full screen for web pages */
.booknav .zoomgrp { display: flex; align-items: center; gap: 2px; margin: 0 2px; padding: 0 4px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.booknav .zoomgrp .icon-btn { font-size: 18px; }
.booknav .pct { min-width: 54px; padding: 0 6px; font-size: 13px; color: var(--ink); }
.booknav .pct:disabled { opacity: 1; color: var(--muted); cursor: default; }
body.phone .booknav .zoomgrp > .icon-btn { display: none; }   /* phones zoom by pinching; the % shows only when zoomed */
body.phone .booknav .zoomgrp { border: 0; margin: 0; padding: 0; }
body.phone .booknav .pct:disabled { display: none; }
body.phone .booknav > .icon-btn { display: none; }     /* phones turn pages by tapping left or right */
body.phone .booknav .count { padding: 0 8px; }
/* Contents button in the bar whenever the sidebar isn't on screen (phones, narrow windows, hidden sidebar) */
.booknav .navcontents { min-height: 34px; padding: 7px 12px; font-size: 13px; border-radius: 999px; }
body.docked .booknav .navcontents { display: none; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 16; width: min(340px, calc(100% - 32px)); background: var(--ink); color: var(--bar); border-radius: 10px; padding: 12px 12px 12px 16px; display: flex; gap: 12px; align-items: center; font-size: 13px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.hint svg { width: 28px; height: 28px; flex: none; }
.hint button { margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 6px; padding: 6px 10px; font: 12px var(--f-ui); }

/* ---------- Flip figure view: the figure large, a quarter turn to the right ---------- */
.reader { position: fixed; inset: 0; z-index: 40; background: var(--reader-bg); display: flex; flex-direction: column; }
.rbar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 10px; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: #fff; font-variant-numeric: tabular-nums; }
.rbar .btn { color: #fff; border-color: rgba(255,255,255,.35); min-width: 38px; }
.rbar .lbl { margin-right: auto; }
.rscroll { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 16px max(24px, env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
body.phone .rscroll { touch-action: none; }   /* the viewer handles pinch and one-finger dragging here too */
.rscroll canvas { display: block; margin: 0 auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.4); }

.toast { position: fixed; left: 50%; bottom: max(80px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bar); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.err { max-width: 50ch; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .side { transition: none !important; } }
</style>

<body>
<aside class="side" id="side" aria-label="Contents">
  <div class="side-head">
    <h1 id="title"></h1>
    <button class="btn ghost icon-btn" id="sideToggle" aria-label="Hide sidebar"></button>
  </div>
  <div class="actions" id="actions"></div>
  <h2 class="label">Contents</h2>
  <ol class="toc" id="toc"></ol>
  <div class="side-foot">
    <a class="btn peach dl" href="thesis.pdf" download>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>
      Download PDF <small class="size"></small></a>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<main class="stage-outer" id="stageOuter">
  <div class="stage" id="stage"><p class="err" id="loading">Loading the book…</p></div>
  <!-- floats over the bottom of the book -->
  <div class="booknav" id="booknav" hidden>
    <button class="btn teal navcontents" id="navContents" aria-controls="side">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Contents</button>
    <button class="btn ghost icon-btn" id="prev" aria-label="Previous page">‹</button>
    <span class="count" id="count"></span>
    <button class="btn ghost icon-btn" id="next" aria-label="Next page">›</button>
    <span class="zoomgrp">
      <button class="btn ghost icon-btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="btn ghost pct" id="zoomPct" title="Back to fit the screen"></button>
      <button class="btn ghost icon-btn" id="zoomIn" aria-label="Zoom in">+</button>
    </span>
    <span id="flipSlot" class="flipslot"></span>
    <button class="btn ghost icon-btn" id="fsBtn" aria-label="Full screen" title="Full screen"></button>
  </div>
</main>

<div class="hint" id="hint" hidden>
  <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="10" height="17" rx="2"/><path d="M5 23a10 10 0 0 0 18 0M20 21l3 2 1-3"/></svg>
  <span>Turn your phone sideways to see two pages side by side.</span>
  <button id="hintClose">OK</button>
</div>
<div class="reader" id="reader" hidden role="dialog" aria-label="Figure view">
  <div class="rbar">
    <span class="lbl" id="rLabel"></span>
    <button class="btn" id="rOut" aria-label="Zoom out">−</button>
    <button class="btn" id="rIn" aria-label="Zoom in">+</button>
    <button class="btn" id="rRot" aria-label="Rotate a quarter turn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-2-4"/><path d="M11 1v3h3"/></svg></button>
    <button class="btn" id="rClose">Close</button>
  </div>
  <div class="rscroll" id="rScroll"><canvas id="rCanvas"></canvas></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="lib/pdf.min.js"></script>
<script src="lib/page-flip.browser.js"></script>
<script>
// DEMO is true only in the Claude preview, where downloads are blocked.
const DEMO = /*DEMO*/false;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage');
const POS_KEY = 'thesis-page', HINT_KEY = 'thesis-hint';
// Pages are drawn at 2× (3× on very sharp screens) and scaled down by the browser:
// on ordinary 1× screens this is what makes small text crisp instead of fuzzy.
const RES = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
const ICON_ROT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-2-4"/><path d="M11 1v3h3"/></svg>';
// Security: every PDF is opened with isEvalSupported: false. This closes CVE-2024-4367 (code
// execution through a crafted font) in this PDF.js version; it only costs a little speed on odd fonts.
pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';

let doc, numPages = 0, aspect = 0.709, config = { title: '', chapters: [], flip: [] };
let flip = null, cleanup = [], currentPage = 1;

// ---------- helpers (storage is optional: the site works without it) ----------
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
// Set only when the admin tool shows this page as its preview (never on the public site).
const DRAFT = window.__DRAFT || null;
let spareData = false;   // phones and data-saver mode: fetch only what is looked at
function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, ms); }
const fmtSize = b => b >= 1048576 ? `${Math.round(b / 1048576)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fileName = t => (t || 'thesis').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 80) + '.pdf';

// ---------- PDF ----------
const pageCache = new Map();
function getPage(n) { if (!pageCache.has(n)) pageCache.set(n, doc.getPage(n)); return pageCache.get(n); }
// Draws page n into a canvas fitting w×h CSS px. In the book a landscape page is turned to fill its
// portrait slot, as in print. extraRot adds a manual turn (90 = a quarter turn to the right).
async function renderInto(canvas, n, w, h, { extraRot = 0, fitRotate = true, onTask = null } = {}) {
  const page = await getPage(n);
  const base = page.getViewport({ scale: 1 });
  let rot = page.rotate;
  if (fitRotate && base.width > base.height && h > w) rot += 90;
  rot = (rot + extraRot) % 360;
  const v1 = page.getViewport({ scale: 1, rotation: rot });
  const scale = Math.min(w / v1.width, h / v1.height);
  // Zoomed-in pages are big: keep each drawing under a pixel budget so memory stays reasonable.
  // Phones get a much tighter budget: iPhone Safari reloads the whole page when the drawings
  // together pass ~224 MB (measured: 206 MB after zooming in with the old budget).
  const res = Math.min(isPhone() ? 2 : RES, Math.sqrt((isPhone() ? 2.5e6 : 6e6) / Math.max(1, w * h)));
  const vp = page.getViewport({ scale: scale * res, rotation: rot });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
  const task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
  if (onTask) onTask(task);
  await task.promise;
}
// Fallback when config.json is missing: chapters from the PDF's own bookmarks.
async function readOutline(d) {
  const out = [];
  for (const it of (await d.getOutline()) || []) {
    try {
      const dest = typeof it.dest === 'string' ? await d.getDestination(it.dest) : it.dest;
      if (!dest) continue;
      const idx = typeof dest[0] === 'number' ? dest[0] : await d.getPageIndex(dest[0]);
      out.push({ title: it.title.trim(), page: idx + 1 });
    } catch {}
  }
  return out.sort((a, b) => a.page - b.page);
}

// ---------- load: thesis.pdf + config.json next to this page, or the admin's draft ----------
// Runs fn up to 3 times, waiting 1 s and then 2 s in between; errors marked final are not retried.
async function retry(fn, tries = 3) {
  for (let i = 1; ; i++) {
    try { return await fn(); }
    catch (e) { if (e.final || i >= tries) throw e; await new Promise(r => setTimeout(r, 1000 * i)); }
  }
}
function setLoading(text) { const p = $('#loading'); if (p) p.textContent = text; }
async function loadBook() {
  const draft = DRAFT;
  let size = 0, chaptersFromPdf = false;
  // config.json says which PDF to show ("pdf"), so the file can keep its own name.
  if (draft) config = draft.config;
  else {
    // A network hiccup must not count as "there is no config.json": that used to send the viewer to a
    // thesis.pdf that doesn't exist. Only a real 404 means "no config"; anything else is tried again.
    config = await retry(async () => {
      const r = await fetch('config.json', { cache: 'no-cache' });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`config.json: server answered ${r.status}`);
      return r.json();
    });
    if (!config) { config = { title: 'Thesis', chapters: [], flip: [] }; chaptersFromPdf = true; }
  }
  let url = new URL(config.pdf || 'thesis.pdf', location.href).href;
  if (draft && draft.blob) {
    doc = await pdfjsLib.getDocument({ data: new Uint8Array(await draft.blob.arrayBuffer()), isEvalSupported: false }).promise;
    url = URL.createObjectURL(draft.blob); size = draft.blob.size;
  } else {
    // Range requests: only the pages you look at (plus the next few) are fetched, so a 40 MB thesis
    // opens as fast as a small one and a short visit costs a few MB instead of the whole file.
    spareData = isPhone() || !!(navigator.connection && navigator.connection.saveData);
    // Tried three times. The last try fetches the PDF in one go instead of in pieces: slower, but it also works
    // behind networks (some company or hospital proxies) that mangle piece-by-piece requests.
    let attempt = 0;
    doc = await retry(() => {
      const whole = ++attempt === 3;
      if (whole) setLoading('Loading the book… (slow connection, fetching the whole PDF)');
      const task = pdfjsLib.getDocument({ url, isEvalSupported: false, ...(whole ? { disableRange: true }
        : { disableAutoFetch: true, disableStream: true, rangeChunkSize: 524288 }) });
      if (whole) task.onProgress = p => p.total && setLoading(`Loading the book… ${Math.round(100 * p.loaded / p.total)}%`);

  // Chapter openings (about 17 MB of artwork) are fetched only for visitors who look like they'll
  // navigate: pointing at or opening the contents, or staying 15 seconds. A quick look costs a few MB.
  if (!zoom) build._w = setTimeout(warmChapters, 15000);
}

// ---------- Flip figure view: the page large and scrollable, a quarter turn to the right ----------
// R.f is the zoom factor: 1 fits the figure to the width of the screen, up to 4.
const R_STEPS = [1, 1.5, 2, 3, 4], R_MAX = 4;
let R = { n: 1, rot: 0, f: 1, task: null, gen: 0 };
async function drawReader(anchor = null) {
  const gen = ++R.gen, scroll = $('#rScroll');
  $('#rLabel').textContent = `Figure on p. ${pn(R.n)}`;
  $('#rOut').disabled = R.f <= 1.001; $('#rIn').disabled = R.f >= R_MAX - 0.001;
  const page = await getPage(R.n);
  if (gen !== R.gen) return;
  const rot = (page.rotate + R.rot) % 360;
  const v1 = page.getViewport({ scale: 1, rotation: rot });
  const cssW = Math.min(scroll.clientWidth - 32, 1100) * R.f;
  const cssH = cssW * v1.height / v1.width;
  const res = Math.min(isPhone() ? 2 : RES, Math.sqrt((isPhone() ? 4e6 : 16e6) / (cssW * cssH)));   // pixel budget (tighter on phones)
  const vp = page.getViewport({ scale: cssW / v1.width * res, rotation: rot });
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  c.style.width = Math.floor(cssW) + 'px'; c.style.height = Math.floor(cssH) + 'px';
  if (R.task) R.task.cancel();
  R.task = page.render({ canvasContext: c.getContext('2d'), viewport: vp });
  try { await R.task.promise; } catch { return; }   // cancelled by a newer request
  if (gen !== R.gen) return;
  const old = $('#rCanvas'); c.id = 'rCanvas'; old.replaceWith(c); old.width = old.height = 0;
  if (anchor) scroll.scrollTo(c.offsetLeft + anchor.fx * cssW - anchor.cx, c.offsetTop + anchor.fy * cssH - anchor.cy);
}
function openReader(n, figure = false) {
  getPage(n).then(p => {
    const v = p.getViewport({ scale: 1 });
    // Flip figure: turn a portrait page a quarter to the right; a landscape page is already upright here.
    R.n = n; R.f = 1; R.rot = figure && v.height > v.width ? 90 : 0;
    $('#reader').hidden = false; $('#rScroll').scrollTo(0, 0);
    drawReader();
  });
}
function readerZoom(d) {
  const next = d > 0 ? R_STEPS.find(s => s > R.f + 0.01) : [...R_STEPS].reverse().find(s => s < R.f - 0.01);
  if (!next) return;
  const sc = $('#rScroll'), c = $('#rCanvas'), r = c.getBoundingClientRect(), s = sc.getBoundingClientRect();
  const cx = sc.clientWidth / 2, cy = sc.clientHeight / 2;   // keep the middle of the screen in place
  R.f = next;
  drawReader({ fx: (s.left + cx - r.left) / r.width, fy: (s.top + cy - r.top) / r.height, cx, cy });
}
// Touch in the figure view: one finger drags, two fingers pinch. Works exactly like the book.
(() => {
  const sc = $('#rScroll'), pts = new Map(); let g = null;
  sc.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    if (e.isPrimary) { pts.clear(); g = null; }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { sc.setPointerCapture(e.pointerId); } catch {}
    if (pts.size === 1) g = { type: 'pan', x: e.clientX, y: e.clientY, sl: sc.scrollLeft, st: sc.scrollTop };
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()], c = $('#rCanvas'), r = c.getBoundingClientRect();
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      c.style.transformOrigin = `${cx - r.left}px ${cy - r.top}px`;
      g = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), cx, cy, f0: R.f, scale: 1, c };
    }
  });
  sc.addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (g.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const f = Math.min(R_MAX, Math.max(1, g.f0 * Math.hypot(a.x - b.x, a.y - b.y) / g.d0));
      g.scale = f / g.f0; g.c.style.transform = `scale(${g.scale})`;
    } else if (g.type === 'pan') {
      sc.scrollLeft = g.sl - (e.clientX - g.x); sc.scrollTop = g.st - (e.clientY - g.y);
    }
  });
  const end = e => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (!g || g.type !== 'pinch') { if (!pts.size) g = null; return; }
    if (pts.size) return;                                 // wait until both fingers are off
    const s = sc.getBoundingClientRect(), r = g.c.getBoundingClientRect();
    const anchor = { fx: (g.cx - r.left) / r.width, fy: (g.cy - r.top) / r.height, cx: g.cx - s.left, cy: g.cy - s.top };
    if (Math.abs(g.scale - 1) > 0.02) { R.f = g.f0 * g.scale; drawReader(anchor); }   // old picture stays until the sharp one is ready
    else g.c.style.transform = '';
    g = null;
  };
  sc.addEventListener('pointerup', end);
  sc.addEventListener('pointercancel', end);
})();
function closeReader() { $('#reader').hidden = true; if (R.task) R.task.cancel(); R.gen++; }
$('#rIn').onclick = () => readerZoom(1);
$('#rOut').onclick = () => readerZoom(-1);
$('#rRot').onclick = () => { R.rot = (R.rot + 90) % 360; drawReader(); };
$('#rClose').onclick = closeReader;
document.addEventListener('keydown', e => {
  if (!$('#reader').hidden) {
    if (e.key === 'Escape') closeReader();
    else if (e.key === '+' || e.key === '=') readerZoom(1);
    else if (e.key === '-') readerZoom(-1);
  } else if (e.key === 'Escape') openSide(false);
  else if (!e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest('input')) {
    if (e.key === '+' || e.key === '=') zoomStep(1);
    else if (e.key === '-') zoomStep(-1);
    else if (e.key === '0') setZoom(null);
  }
});

// ---------- full screen: hides the browser's tabs and address bar, so the book gets more height ----------
const ICON_FS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>';
const ICON_FS_EXIT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>';
function updateFsBtn() {
  const on = !!document.fullscreenElement, b = $('#fsBtn');
  b.innerHTML = on ? ICON_FS_EXIT : ICON_FS;
  b.setAttribute('aria-label', on ? 'Leave full screen' : 'Full screen');
  b.title = on ? 'Leave full screen (Esc)' : 'Full screen';
}
if (!document.fullscreenEnabled) $('#fsBtn').hidden = true;
updateFsBtn();
$('#fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here.'));
};
// The window changes size: lay the book out again for the new space.
document.addEventListener('fullscreenchange', () => {
  updateFsBtn();
  setTimeout(() => { lastW = innerWidth; lastH = innerHeight; applyMode(); build(currentPage); }, 150);
});

if (DEMO) {
  $$('.dl').forEach(a => a.addEventListener('click', () => toast('Downloads are blocked in this preview. On the real site this saves the PDF.')));}

// ---------- start: always on the closed cover ----------
let rt, lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 120) return;   // ignore mobile address-bar jitter
    lastW = innerWidth; lastH = innerHeight; applyMode(); build(currentPage);
  }, 250);
});
(async () => {
  applyMode();
  try { await loadBook(); build(1); showResume(); }
  catch (e) {
    // Plain words for the visitor, a direct download link, and the technical reason in small print so a
    // screenshot tells us what went wrong.
    console.error(e);
    const pdf = config && (config.download || config.pdf);
    stage.innerHTML = `<div class="err"><p>The book couldn't be loaded right now.</p>
      <p><button class="btn" onclick="location.reload()">Try again</button>${pdf ? ` <a class="btn" href="${esc(pdf)}" download>Download the PDF</a>` : ''}</p>
      <p style="font-size:12px">${esc(e.message || e.name || e)}</p></div>`;
  }
})();
</script>
</body>
</html>
