<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Thesis</title>
<style>
/* Layout: a sidebar on the left (title, where you are, contents, download) and the book filling the
   rest at full height. Narrow screens and phones: the sidebar slides in from a floating button.
   Colour: neutral greys; the cover's teal for navigation, its peach for the two document actions. */
:root {
  --desk: #dfe3e5; --desk-shade: #cfd5d8; --bar: #f6f7f7; --panel: #ffffff;
  --ink: #1d2a31; --muted: #5a6970; --line: #d3d9dc;
  --teal: #3b7590; --teal-2: #5e98a3; --teal-ink: #ffffff; --teal-soft: #e3eff2;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #d98f52;
  --reader-bg: #1c262b;
  --f-title: Georgia, "Times New Roman", serif;
  --f-ui: Georgia, "Times New Roman", serif;
  --side-w: 280px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #161b1e; --desk-shade: #0f1315; --bar: #1f262a; --panel: #1a2024; --ink: #e4e9eb; --muted: #9aa8ae;
  --line: #2f3a42; --teal: #4f8ea6; --teal-2: #6aa6b0; --teal-ink: #ffffff; --teal-soft: #1e3640;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #f2af78; color-scheme: dark } }
:root[data-theme="dark"] {
  --desk: #161b1e; --desk-shade: #0f1315; --bar: #1f262a; --panel: #1a2024; --ink: #e4e9eb; --muted: #9aa8ae;
  --line: #2f3a42; --teal: #4f8ea6; --teal-2: #6aa6b0; --teal-ink: #ffffff; --teal-soft: #1e3640;
  --peach: #f2af78; --peach-ink: #3d2410; --peach-line: #f2af78; color-scheme: dark }

html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 40%, var(--desk) 0%, var(--desk-shade) 100%) fixed, var(--desk);
  color: var(--ink); font-family: var(--f-ui); font-size: 14px;
  display: flex; overflow: hidden;
}
.btn {
  font: 14px/1 var(--f-ui); border-radius: 6px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); text-decoration: none; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px;
}
.btn:hover { border-color: var(--teal); }
.btn:disabled { opacity: .35; cursor: default; border-color: var(--line); }
.btn.ghost { border-color: transparent; }
.btn:focus-visible, .toc a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn small { opacity: .75; font-size: 12px; }
.btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn { width: 38px; padding: 0; }
.btn.teal { background: linear-gradient(135deg, var(--teal), var(--teal-2)); color: var(--teal-ink); border-color: transparent; }
.btn.teal:hover { filter: brightness(1.07); }
.btn.peach { background: var(--peach); color: var(--peach-ink); border-color: var(--peach-line); }
.btn.peach:hover { filter: brightness(1.04); border-color: var(--peach-ink); }

/* ---------- sidebar ---------- */
.side {
  flex: none; width: var(--side-w); height: 100%; box-sizing: border-box; min-width: 0;
  display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
}
.side-head { display: flex; gap: 6px; align-items: flex-start; padding: 20px 10px 14px 20px; }
.side-head h1 {
  font: 700 17px/1.32 var(--f-title); margin: 0; flex: 1 1 auto; min-width: 0; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
}
.actions { display: grid; gap: 8px; padding: 0 16px 14px 20px; }
.actions:empty { display: none; }
.label { margin: 0; padding: 14px 20px 6px; font-size: 11px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); }
.toc { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.toc a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.35; font-size: 14px; }
.toc a small { grid-column: 1 / -1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc a .pg { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; align-self: start; }
.toc a:hover { background: var(--teal-soft); }
.toc a[aria-current="true"] { background: var(--teal-soft); color: var(--teal); font-weight: 700; }
.toc a[aria-current="true"] small, .toc a[aria-current="true"] .pg { color: var(--teal); }
.side-foot { flex: none; border-top: 1px solid var(--line); padding: 14px 16px 16px 20px; display: grid; gap: 10px; }

/* sidebar as a slide-in panel (narrow screens, phones, or hidden by the reader) */
body:not(.docked) .side {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 88vw); z-index: 31;
  transform: translateX(-102%); visibility: hidden; transition: transform .25s ease, visibility .25s;
  box-shadow: 8px 0 30px rgba(0,0,0,.18);
}
body:not(.docked) .side.open { transform: none; visibility: visible; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.float { position: fixed; z-index: 20; top: max(12px, env(safe-area-inset-top, 0px)); transition: transform .25s ease, opacity .25s ease; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#opener { left: max(12px, env(safe-area-inset-left, 0px)); }
#fabDl { right: max(12px, env(safe-area-inset-right, 0px)); }
body.docked #opener, body.docked #fabDl, body:not(.phone) #fabDl { display: none; }
body.chrome-off .float { transform: translateY(-160%); opacity: 0; }

/* ---------- stage + book ---------- */
.stage { flex: 1 1 auto; min-width: 0; height: 100%; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px 16px; }
body.phone .stage { padding: 8px; }
.bookwrap { position: relative; }
#book { position: relative; }   /* no CSS filter here: it makes the browser re-rasterise the pages and soften text */
#book .page { box-shadow: 0 8px 22px rgba(0,0,0,.16); }
.page { background: #fff; overflow: hidden; }
.page canvas { display: block; width: 100%; height: 100%; }
.page .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa4ab; font: 12px var(--f-ui); }
#book .page::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; z-index: 2; }
#book .page.l::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }
#book .page.r::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.12), transparent); }
.tapzones { position: absolute; inset: 0; display: grid; grid-template-columns: 30% 40% 30%; z-index: 5; }
.tapzones button { background: transparent; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* Page number, page turning and Flip figure: one floating bar over the bottom of the book */
.booknav {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 10px)); z-index: 16;
  display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line);
  box-shadow: 0 6px 20px rgba(0,0,0,.18); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.booknav .btn { min-height: 34px; border-radius: 999px; }
.booknav .icon-btn { width: 34px; font-size: 18px; }
.booknav .count { padding: 0 8px; font-size: 13px; color: var(--muted); }
.booknav .flipslot { display: flex; gap: 4px; }
.booknav .flipslot:empty { display: none; }
.booknav .flipslot .btn { padding: 7px 13px; font-size: 13px; }
body > .booknav { display: none; }                    /* until the book is on screen */
body.phone .booknav .icon-btn { display: none; }      /* phones turn pages by tapping left or right */
body.phone .booknav .count { padding: 0 12px; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 16; width: min(340px, calc(100% - 32px)); background: var(--ink); color: var(--bar); border-radius: 10px; padding: 12px 12px 12px 16px; display: flex; gap: 12px; align-items: center; font-size: 13px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.hint svg { width: 28px; height: 28px; flex: none; }
.hint button { margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 6px; padding: 6px 10px; font: 12px var(--f-ui); }

/* ---------- Flip figure view: the figure large, a quarter turn to the right ---------- */
.reader { position: fixed; inset: 0; z-index: 40; background: var(--reader-bg); display: flex; flex-direction: column; }
.rbar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 10px; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: #fff; font-variant-numeric: tabular-nums; }
.rbar .btn { color: #fff; border-color: rgba(255,255,255,.35); min-width: 38px; }
.rbar .lbl { margin-right: auto; }
.rscroll { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 16px max(24px, env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.rscroll canvas { display: block; margin: 0 auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.4); }

.toast { position: fixed; left: 50%; bottom: max(80px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bar); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.err { max-width: 50ch; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .side, .float { transition: none !important; } }
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Contents">
  <div class="side-head">
    <h1 id="title"></h1>
    <button class="btn ghost icon-btn" id="sideToggle" aria-label="Hide sidebar"></button>
  </div>
  <div class="actions" id="actions"></div>
  <h2 class="label">Contents</h2>
  <ol class="toc" id="toc"></ol>
  <div class="side-foot">
    <a class="btn peach dl" href="thesis.pdf" download>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>
      Download PDF <small class="size"></small></a>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<main class="stage" id="stage"><p class="err">Loading the book…</p></main>

<button class="btn teal float" id="opener" aria-controls="side">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Contents</button>
<a class="btn peach float dl" id="fabDl" href="thesis.pdf" download>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>PDF</a>

<!-- floats over the bottom of the book; moved into the stage when the book is built -->
<div class="booknav" id="booknav">
  <button class="btn ghost icon-btn" id="prev" aria-label="Previous page">‹</button>
  <span class="count" id="count"></span>
  <button class="btn ghost icon-btn" id="next" aria-label="Next page">›</button>
  <span id="flipSlot" class="flipslot"></span>
</div>
<div class="hint" id="hint" hidden>
  <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="10" height="17" rx="2"/><path d="M5 23a10 10 0 0 0 18 0M20 21l3 2 1-3"/></svg>
  <span>Turn your phone sideways to see two pages side by side.</span>
  <button id="hintClose">OK</button>
</div>
<div class="reader" id="reader" hidden role="dialog" aria-label="Figure view">
  <div class="rbar">
    <span class="lbl" id="rLabel"></span>
    <button class="btn" id="rOut" aria-label="Zoom out">−</button>
    <button class="btn" id="rIn" aria-label="Zoom in">+</button>
    <button class="btn" id="rRot" aria-label="Rotate a quarter turn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-2-4"/><path d="M11 1v3h3"/></svg></button>
    <button class="btn" id="rClose">Close</button>
  </div>
  <div class="rscroll" id="rScroll"><canvas id="rCanvas"></canvas></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
// DEMO is true only in the Claude preview, where downloads are blocked.
const DEMO = /*DEMO*/false;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage');
const POS_KEY = 'thesis-page', HINT_KEY = 'thesis-hint';
// Pages are drawn at 2× (3× on very sharp screens) and scaled down by the browser:
// on ordinary 1× screens this is what makes small text crisp instead of fuzzy.
const RES = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
const ICON_ROT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-2-4"/><path d="M11 1v3h3"/></svg>';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let doc, numPages = 0, aspect = 0.709, config = { title: '', chapters: [], flip: [] };
let flip = null, cleanup = [], currentPage = 1;

// ---------- helpers (storage is optional: the site works without it) ----------
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
// Set only when the admin tool shows this page as its preview (never on the public site).
const DRAFT = window.__DRAFT || null;
let spareData = false;   // phones and data-saver mode: fetch only what is looked at
function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, ms); }
const fmtSize = b => b >= 1048576 ? `${Math.round(b / 1048576)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fileName = t => (t || 'thesis').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 80) + '.pdf';

// ---------- PDF ----------
const pageCache = new Map();
function getPage(n) { if (!pageCache.has(n)) pageCache.set(n, doc.getPage(n)); return pageCache.get(n); }
// Draws page n into a canvas fitting w×h CSS px. In the book a landscape page is turned to fill its
// portrait slot, as in print. extraRot adds a manual turn (90 = a quarter turn to the right).
async function renderInto(canvas, n, w, h, { extraRot = 0, fitRotate = true, onTask = null } = {}) {
  const page = await getPage(n);
  const base = page.getViewport({ scale: 1 });
  let rot = page.rotate;
  if (fitRotate && base.width > base.height && h > w) rot += 90;
  rot = (rot + extraRot) % 360;
  const v1 = page.getViewport({ scale: 1, rotation: rot });
  const scale = Math.min(w / v1.width, h / v1.height);
  const vp = page.getViewport({ scale: scale * RES, rotation: rot });
  canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
  const task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
  if (onTask) onTask(task);
  await task.promise;
}
// Fallback when config.json is missing: chapters from the PDF's own bookmarks.
async function readOutline(d) {
  const out = [];
  for (const it of (await d.getOutline()) || []) {
    try {
      const dest = typeof it.dest === 'string' ? await d.getDestination(it.dest) : it.dest;
      if (!dest) continue;
      const idx = typeof dest[0] === 'number' ? dest[0] : await d.getPageIndex(dest[0]);
      out.push({ title: it.title.trim(), page: idx + 1 });
    } catch {}
  }
  return out.sort((a, b) => a.page - b.page);
}

// ---------- load: thesis.pdf + config.json next to this page, or the admin's draft ----------
async function loadBook() {
  const draft = DRAFT;
  let size = 0, chaptersFromPdf = false;
  // config.json says which PDF to show ("pdf"), so the file can keep its own name.
  if (draft) config = draft.config;
  else {
    try { const r = await fetch('config.json', { cache: 'no-cache' }); if (!r.ok) throw 0; config = await r.json(); }
    catch { config = { title: 'Thesis', chapters: [], flip: [] }; chaptersFromPdf = true; }
  }
  let url = new URL(config.pdf || 'thesis.pdf', location.href).href;
  if (draft && draft.blob) {
    doc = await pdfjsLib.getDocument({ data: new Uint8Array(await draft.blob.arrayBuffer()) }).promise;
    url = URL.createObjectURL(draft.blob); size = draft.blob.size;
  } else {
    // Range requests: the pages you look at are fetched first, so a 40 MB thesis opens as fast as a
    // small one. On computers the rest then downloads in the background, so jumping to a chapter is
    // instant once it's in. Phones (and data-saver mode) only fetch what is looked at, to spare data.
    spareData = isPhone() || !!(navigator.connection && navigator.connection.saveData);
    try { doc = await pdfjsLib.getDocument({ url, disableAutoFetch: spareData, disableStream: true, rangeChunkSize: 524288 }).promise; }
    catch (e) { throw new Error(`the file “${decodeURIComponent(url.split('/').pop())}” was not found next to this page. Check the "pdf" name in config.json`); }
    // File size for the download button, asked separately: never wait for the whole PDF to arrive.
    fetch(url, { method: 'HEAD' }).then(r => {
      const len = +r.headers.get('content-length');
      if (len) $$('.dl .size').forEach(s => s.textContent = fmtSize(len));
    }).catch(() => {});
  }
  if (chaptersFromPdf) config.chapters = await readOutline(doc);
  config.flip = config.flip || []; config.chapters = config.chapters || [];
  numPages = doc.numPages;
  aspect = (await getPage(1)).getViewport({ scale: 1 }).width / (await getPage(1)).getViewport({ scale: 1 }).height;
  $('#title').textContent = config.title || 'Thesis';
  document.title = config.title || 'Thesis';
  $$('.dl').forEach(a => { a.href = url; a.download = fileName(config.title); if (size) a.querySelector('.size').textContent = fmtSize(size); });
  renderToc();
}

// ---------- reading position ----------
const savedPos = () => parseInt(ls.get(POS_KEY), 10) || 0;
function setCurrent(p) { currentPage = p; if (p > 1) ls.set(POS_KEY, String(p)); updateTocCurrent(); }
let resumeAt = 0;   // shown in the sidebar until the reader moves on
function showResume() { const p = savedPos(); resumeAt = p > 1 && p <= numPages ? p : 0; renderActions(); }

// ---------- contents ----------
function chapterAt(p) { let c = null; for (const ch of config.chapters) if (ch.page <= p) c = ch; return c; }
function renderToc() {
  // "Chapter 2 — Ex vivo drug…" is shown as a small "Chapter 2" label above the title.
  $('#toc').innerHTML = config.chapters.length
    ? config.chapters.map(ch => {
        const [lead, ...rest] = ch.title.split(' — ');
        const label = rest.length ? `<small>${esc(lead)}</small>` : '';
        return `<li><a href="#" data-page="${ch.page}">${label}<span>${esc(rest.length ? rest.join(' — ') : lead)}</span><span class="pg">${ch.page}</span></a></li>`;
      }).join('')
    : '<li class="err" style="padding:12px">No chapters available.</li>';
  updateTocCurrent();
}
let lastChapter = null;
function updateTocCurrent() {
  const c = chapterAt(currentPage);
  $$('#toc a').forEach(a => a.setAttribute('aria-current', !!c && +a.dataset.page === c.page));
  if (c !== lastChapter) { lastChapter = c; $('#toc a[aria-current="true"]')?.scrollIntoView({ block: 'nearest' }); }
}
$('#toc').onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); goTo(+a.dataset.page); openSide(false); };

// ---------- sidebar: docked next to the book, or a slide-in panel ----------
// Docked on screens of 900 px and wider, unless the reader hid it. Otherwise it slides in from
// the floating "Contents" button (on phones there's also a floating "PDF" button).
const COLLAPSE_KEY = 'thesis-side-hidden';
const ICON_HIDE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3 5 8l5 5"/></svg>';
const ICON_PIN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3l5 5-5 5"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
const wideEnough = () => innerWidth >= 900 && !isPhone();
function applyMode() {
  const docked = wideEnough() && ls.get(COLLAPSE_KEY) !== '1';
  document.body.classList.toggle('docked', docked);
  document.body.classList.toggle('phone', isPhone());
  openSide(false);
  const t = $('#sideToggle');
  if (docked) { t.innerHTML = ICON_HIDE; t.setAttribute('aria-label', 'Hide sidebar'); t.title = 'Hide sidebar'; }
  else if (wideEnough()) { t.innerHTML = ICON_PIN; t.setAttribute('aria-label', 'Keep sidebar open'); t.title = 'Keep sidebar open'; }
  else { t.innerHTML = ICON_CLOSE; t.setAttribute('aria-label', 'Close'); t.title = 'Close'; }
}
function openSide(o) {
  if (document.body.classList.contains('docked')) o = false;
  $('#side').classList.toggle('open', o); $('#scrim').hidden = !o;
  if (o) setTimeout(() => $('#sideToggle').focus(), 50);
}
$('#opener').onclick = () => openSide(true);
$('#scrim').onclick = () => openSide(false);
$('#sideToggle').onclick = () => {
  if (document.body.classList.contains('docked')) ls.set(COLLAPSE_KEY, '1');
  else if (wideEnough()) ls.set(COLLAPSE_KEY, '0');
  else { openSide(false); return; }
  applyMode(); build(currentPage);   // the book gets (or gives back) the sidebar's width
};
function goTo(p) { if (flip) { flip.turnToPage(p - 1); onFlip(flip.getCurrentPageIndex()); } }

// ---------- phones ----------
// The admin preview can force phone mode, since a desktop mouse never counts as a touch screen.
const isPhone = () => !!(DRAFT && DRAFT.phone) || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 600);
const isPortrait = () => innerHeight > innerWidth;
function setChrome(on) { document.body.classList.toggle('chrome-off', !on); }
function updateHint() { $('#hint').hidden = !(isPhone() && isPortrait() && ls.get(HINT_KEY) !== 'done'); }
$('#hintClose').onclick = () => { ls.set(HINT_KEY, 'done'); updateHint(); };

// ---------- pages ----------
function makePage(n, w, h) {
  const el = document.createElement('div');
  el.className = 'page' + (n > 1 && n < numPages ? (n % 2 === 0 ? ' l' : ' r') : '');
  if (n === 1 || n === numPages) el.dataset.density = 'hard';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.innerHTML = `<div class="ph">p. ${n}</div>`;
  el.dataset.n = n;
  return el;
}
// ---------- render queue: the pages you look at first, then the ones you'll look at next ----------
// At most two pages are drawn at once, so the visible ones don't share the connection and the
// processor with pages you can't see. Pages far away are cleared again to keep memory in check.
const PARALLEL = 2, KEEP = 8;
let queue = [], busy = 0;
function schedule(order) {
  queue = order.filter(n => n >= 1 && n <= numPages);
  // The reader goes first: stop drawing ahead, unless it is drawing one of the pages wanted now.
  if (warmTask && !queue.slice(0, 2).includes(warmPage)) { warmTask.cancel(); warmTask = null; }
  pump();
}
function pump() {
  while (busy < PARALLEL && queue.length) {
    const n = queue.shift(), book = flip, el = book && book._pages[n - 1];
    if (!el || el.dataset.state) continue;
    el.dataset.state = 'busy'; busy++;
    const c = document.createElement('canvas');
    renderInto(c, n, book._w, book._h)
      .then(() => {
        if (el.dataset.state !== 'busy') { c.width = c.height = 0; return; }   // cleared while drawing
        el.querySelector('.ph')?.remove(); c.style.width = c.style.height = '100%';
        el.prepend(c); el.dataset.state = 'done';
      })
      .catch(() => { delete el.dataset.state; })
      .finally(() => { busy--; pump(); });
  }
}
function clearFar(center) {
  flip._pages.forEach((el, k) => {
    const n = k + 1;
    if (Math.abs(n - center) <= KEEP || !el.dataset.state || CHAPTER_PAGES.has(n)) return;
    const c = el.querySelector('canvas'); if (c) { c.width = c.height = 0; c.remove(); }
    if (!el.querySelector('.ph')) el.insertAdjacentHTML('afterbegin', `<div class="ph">p. ${n}</div>`);
    delete el.dataset.state;
    getPage(n).then(p => p.cleanup()).catch(() => {});
  });
}

// ---------- chapter openings drawn ahead ----------
// Chapter openings carry full-page artwork that takes 0.5–2 s to unpack the first time.
// On computers, while the reader is idle, those spreads are drawn into the book in advance and
// kept, so jumping from the contents is instant. Phones skip this to spare data and memory.
let CHAPTER_PAGES = new Set(), warmTask = null, warmPage = 0, warmRun = 0;
const spreadOf = p => p <= 1 ? [1] : p % 2 === 0 ? [p, p + 1] : [p - 1, p];
async function warmChapters() {
  if (spareData || !flip) return;
  const run = ++warmRun, book = flip;
  CHAPTER_PAGES = new Set(config.chapters.flatMap(ch => spreadOf(ch.page)).filter(n => n <= numPages));
  const todo = [...CHAPTER_PAGES];
  while (todo.length) {
    while (busy || queue.length) await new Promise(r => setTimeout(r, 300));   // the reader always goes first
    if (run !== warmRun || book !== flip) return;                               // book was rebuilt
    const n = todo[0], el = book._pages[n - 1];
    if (!el || el.dataset.state) { todo.shift(); continue; }
    el.dataset.state = 'busy'; warmPage = n;
    const c = document.createElement('canvas');
    try {
      await renderInto(c, n, book._w, book._h, { onTask: t => warmTask = t });
      el.querySelector('.ph')?.remove(); c.style.width = c.style.height = '100%';
      el.prepend(c); el.dataset.state = 'done'; todo.shift();
    } catch { delete el.dataset.state; c.width = c.height = 0; }   // interrupted: retry later
    warmTask = null; warmPage = 0;
  }
}
function flipButtons(pages, cls) {
  const marked = pages.filter(p => config.flip.includes(p));
  return marked.map(p => `<button class="${cls}" data-flip="${p}">${ICON_ROT} Flip figure${pages.length > 1 ? ` p. ${p}` : ''}</button>`).join('');
}
let visiblePages = [1];
// Sidebar action: "Continue at p. X" while you're still on the cover.
function renderActions() {
  const resume = resumeAt && !visiblePages.includes(resumeAt) && currentPage <= 1
    ? `<button class="btn" data-resume>Continue at p. ${resumeAt}</button>` : '';
  $('#actions').innerHTML = resume;
}
$('#actions').addEventListener('click', e => { if (e.target.closest('[data-resume]')) { goTo(resumeAt); resumeAt = 0; renderActions(); } });
// The floating bar over the book: page number, page turning, and Flip figure when the open pages need it.
const booknav = $('#booknav');
function updateNav() { $('#flipSlot').innerHTML = flipButtons(visiblePages, 'btn peach'); }
document.addEventListener('click', e => { const b = e.target.closest('[data-flip]'); if (b) { e.stopPropagation(); openReader(+b.dataset.flip, true); } }, true);

// ---------- the flipbook ----------
function sizeFor(single) {
  const r = stage.getBoundingClientRect();
  const pad = isPhone() ? 16 : 32;
  const per = single ? r.width - pad : (r.width - pad) / 2;
  const w = Math.max(140, Math.floor(Math.min(per, (r.height - pad) * aspect)));
  return { w, h: Math.floor(w / aspect) };
}
function onFlip(i) {
  let vis;
  if (flip._single || i === 0) vis = [i];
  else { const left = i % 2 === 1 ? i : i - 1; vis = [left, left + 1].filter(k => k < numPages); }   // spreads are (2,3), (4,5)…
  visiblePages = vis.map(k => k + 1);
  const first = visiblePages[0], last = visiblePages[visiblePages.length - 1];
  schedule([...visiblePages, last + 1, last + 2, first - 1, first - 2, last + 3, last + 4]);
  clearFar(last);
  $('#count').textContent = i === 0 ? 'Cover' : visiblePages.length > 1 ? `p. ${visiblePages[0]}–${visiblePages[1]} of ${numPages}` : `p. ${last} of ${numPages}`;
  $('#prev').disabled = i === 0; $('#next').disabled = last >= numPages;
  setCurrent(last);
  renderActions();
  updateNav();
}
function build(start) {
  cleanup.forEach(f => f()); cleanup = [];
  if (flip) { try { flip.destroy(); } catch {} flip = null; }
  const phone = isPhone();
  setChrome(true);
  const single = phone ? isPortrait() : stage.getBoundingClientRect().width < 640;
  const { w, h } = sizeFor(single);
  stage.innerHTML = `<div class="bookwrap"><div id="book"></div>${phone ? '<div class="tapzones"><button data-t="prev" aria-label="Previous page"></button><button data-t="menu" aria-label="Show or hide controls"></button><button data-t="next" aria-label="Next page"></button></div>' : ''}</div>`;
  stage.appendChild(booknav);
  const pages = [];
  for (let n = 1; n <= numPages; n++) pages.push(makePage(n, w, h));
  flip = new St.PageFlip($('#book'), {
    width: w, height: h, size: 'fixed', showCover: true, usePortrait: single,
    maxShadowOpacity: .45, mobileScrollSupport: false, flippingTime: 650, useMouseEvents: !phone
  });
  flip.loadFromHTML(pages);
  Object.assign(flip, { _pages: pages, _w: w, _h: h, _single: single });
  flip.on('flip', e => onFlip(e.data));
  if (start > 1) flip.turnToPage(start - 1);
  onFlip(flip.getCurrentPageIndex());
  $('#prev').onclick = () => flip.flipPrev();
  $('#next').onclick = () => flip.flipNext();
  const tz = stage.querySelector('.tapzones');
  if (tz) tz.onclick = e => {
    const t = e.target.dataset.t;
    if (t === 'prev') { flip.flipPrev(); setChrome(false); }
    else if (t === 'next') { flip.flipNext(); setChrome(false); }
    else setChrome(document.body.classList.contains('chrome-off'));
  };
  // Desktop: click a page to turn it (the flipbook does this itself), or drag a corner, or use the keys.
  const key = e => { if (!$('#reader').hidden || $('#side').classList.contains('open')) return; if (e.key === 'ArrowRight') flip.flipNext(); if (e.key === 'ArrowLeft') flip.flipPrev(); };
  document.addEventListener('keydown', key);
  cleanup.push(() => document.removeEventListener('keydown', key));
  updateHint();
  // Phones: show the controls briefly so people know they exist, then give the page the full screen.
  clearTimeout(build._t);
  if (phone) build._t = setTimeout(() => { if (!$('#side').classList.contains('open')) setChrome(false); }, 2500);
  clearTimeout(build._w); build._w = setTimeout(warmChapters, 1500);   // after the first view is on screen
}

// ---------- Flip figure view: the page large and scrollable, a quarter turn to the right ----------
const ZOOMS = [1, 1.5, 2, 3];
let R = { n: 1, rot: 0, z: 0, task: null, gen: 0 };
async function drawReader() {
  const gen = ++R.gen, scroll = $('#rScroll');
  $('#rLabel').textContent = `Figure on p. ${R.n}`;
  $('#rOut').disabled = R.z === 0; $('#rIn').disabled = R.z === ZOOMS.length - 1;
  const page = await getPage(R.n);
  if (gen !== R.gen) return;
  const rot = (page.rotate + R.rot) % 360;
  const v1 = page.getViewport({ scale: 1, rotation: rot });
  const cssW = Math.min(scroll.clientWidth - 32, 1100) * ZOOMS[R.z];
  const cssH = cssW * v1.height / v1.width;
  const res = Math.min(RES, Math.sqrt(16e6 / (cssW * cssH)));   // keep the canvas under ~16 megapixels
  const vp = page.getViewport({ scale: cssW / v1.width * res, rotation: rot });
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  c.style.width = Math.floor(cssW) + 'px'; c.style.height = Math.floor(cssH) + 'px';
  if (R.task) R.task.cancel();
  R.task = page.render({ canvasContext: c.getContext('2d'), viewport: vp });
  try { await R.task.promise; } catch { return; }   // cancelled by a newer request
  if (gen !== R.gen) return;
  const old = $('#rCanvas'); c.id = 'rCanvas'; old.replaceWith(c); old.width = old.height = 0;
}
function openReader(n, figure = false) {
  getPage(n).then(p => {
    const v = p.getViewport({ scale: 1 });
    // Flip figure: turn a portrait page a quarter to the right; a landscape page is already upright here.
    R.n = n; R.z = 0; R.rot = figure && v.height > v.width ? 90 : 0;
    $('#reader').hidden = false; $('#rScroll').scrollTo(0, 0);
    drawReader();
  });
}
function readerZoom(d) { const z = Math.max(0, Math.min(ZOOMS.length - 1, R.z + d)); if (z !== R.z) { R.z = z; drawReader(); } }
function closeReader() { $('#reader').hidden = true; if (R.task) R.task.cancel(); R.gen++; }
$('#rIn').onclick = () => readerZoom(1);
$('#rOut').onclick = () => readerZoom(-1);
$('#rRot').onclick = () => { R.rot = (R.rot + 90) % 360; drawReader(); };
$('#rClose').onclick = closeReader;
document.addEventListener('keydown', e => {
  if (!$('#reader').hidden) {
    if (e.key === 'Escape') closeReader();
    else if (e.key === '+' || e.key === '=') readerZoom(1);
    else if (e.key === '-') readerZoom(-1);
  } else if (e.key === 'Escape') openSide(false);
});

if (DEMO) {
  $$('.dl').forEach(a => a.addEventListener('click', () => toast('Downloads are blocked in this preview. On the real site this saves the PDF.')));}

// ---------- start: always on the closed cover ----------
let rt, lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 120) return;   // ignore mobile address-bar jitter
    lastW = innerWidth; lastH = innerHeight; applyMode(); build(currentPage);
  }, 250);
});
(async () => {
  applyMode();
  try { await loadBook(); build(1); showResume(); }
  catch (e) { stage.innerHTML = `<p class="err">The book could not be loaded (${esc(e.message || e)}). You can still download the PDF from the sidebar.</p>`; }
})();
</script>
</body>
</html>
